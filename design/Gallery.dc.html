<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #93b8ff; text-decoration: none; } a:hover { color: #c7dbff; }
  </style>
</helmet>

<div style="position:relative; width:1240px; height:840px; overflow:hidden;
     background:
       radial-gradient(60rem 40rem at 85% -10%, rgba(59,130,246,0.16), transparent 60%),
       #0a0a0f; color:#f5f5f5;">

  <!-- nav -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:28px 56px;">
    <span style="font-weight:600; letter-spacing:-0.01em;">Jason Draper</span>
    <div style="display:flex; gap:26px; font-size:14.5px; color:#a0a0a0;"><a>Writing</a><a>Systems</a><a>About</a></div>
  </div>

  <div style="padding:6px 56px 0;">
    <p style="color:#a0a0a0; font-size:17px; margin:0 0 20px; max-width:56ch;">
      <span style="color:#f5f5f5; font-weight:500;">I build AI agents that can't be “mostly right.”</span>
      Each idea gets its own scene.</p>

    <!-- big featured scene card: the library -->
    <div style="position:relative; height:360px; border-radius:24px; overflow:hidden;
         border:1px solid rgba(255,255,255,0.10);
         background:linear-gradient(180deg, rgba(59,130,246,0.14), rgba(10,10,15,0.2)), #0c0c14;
         box-shadow:0 20px 60px rgba(0,0,0,0.4);">
      <!-- line-art library motif (placeholder for a 3D render) -->
      <svg viewBox="0 0 1120 360" width="100%" height="100%" style="position:absolute; inset:0; opacity:0.5;"
           fill="none" stroke="#93b8ff" stroke-width="1.4">
        <g stroke-opacity="0.55">
          <rect x="640" y="70" width="150" height="230" rx="4"/>
          <line x1="640" y1="128" x2="790" y2="128"/><line x1="640" y1="186" x2="790" y2="186"/><line x1="640" y1="244" x2="790" y2="244"/>
          <rect x="812" y="70" width="150" height="230" rx="4"/>
          <line x1="812" y1="128" x2="962" y2="128"/><line x1="812" y1="186" x2="962" y2="186"/><line x1="812" y1="244" x2="962" y2="244"/>
          <rect x="984" y="70" width="120" height="230" rx="4"/>
          <line x1="984" y1="128" x2="1104" y2="128"/><line x1="984" y1="186" x2="1104" y2="186"/>
        </g>
        <g stroke-opacity="0.8" stroke-width="1.6">
          <circle cx="470" cy="150" r="26"/>
          <path d="M470 176 L470 250 M470 250 L446 300 M470 250 L494 300 M470 196 L438 232 M470 196 L512 232"/>
        </g>
      </svg>
      <div style="position:absolute; left:0; right:0; bottom:0; padding:30px 34px;
           background:linear-gradient(0deg, rgba(8,8,13,0.85), transparent);">
        <span style="font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#93b8ff; font-weight:600;">Featured · Dec 2025</span>
        <h2 style="font-size:36px; letter-spacing:-0.02em; font-weight:600; margin:8px 0 0;">Albert Einstein Walks Into a Library</h2>
      </div>
    </div>

    <!-- two smaller scene cards -->
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:20px;">
      <div style="position:relative; height:180px; border-radius:20px; overflow:hidden;
           border:1px solid rgba(255,255,255,0.09); background:#0c0c14;">
        <svg viewBox="0 0 540 180" width="100%" height="100%" style="position:absolute;inset:0;opacity:0.45;" fill="none" stroke="#93b8ff" stroke-width="1.4" stroke-opacity="0.7">
          <rect x="60" y="40" width="90" height="60" rx="4"/><rect x="170" y="40" width="90" height="60" rx="4"/><rect x="280" y="40" width="90" height="60" rx="4"/><rect x="390" y="40" width="90" height="60" rx="4"/>
          <line x1="60" y1="120" x2="480" y2="120"/>
        </svg>
        <div style="position:absolute; left:24px; bottom:22px;">
          <div style="font-size:20px; font-weight:600;">Creed</div>
          <div style="color:#a0a0a0; font-size:13px; margin-top:3px;">Autonomous QA, 24/7</div>
        </div>
      </div>
      <div style="position:relative; height:180px; border-radius:20px; overflow:hidden;
           border:1px solid rgba(255,255,255,0.09); background:#0c0c14;">
        <svg viewBox="0 0 540 180" width="100%" height="100%" style="position:absolute;inset:0;opacity:0.45;" fill="none" stroke="#93b8ff" stroke-width="1.4" stroke-opacity="0.7">
          <rect x="210" y="34" width="120" height="96" rx="4"/><line x1="230" y1="58" x2="310" y2="58"/><line x1="230" y1="78" x2="310" y2="78"/><line x1="230" y1="98" x2="290" y2="98"/>
          <circle cx="330" cy="120" r="16"/><line x1="342" y1="132" x2="356" y2="146"/>
        </svg>
        <div style="position:absolute; left:24px; bottom:22px;">
          <div style="font-size:20px; font-weight:600;">CoAudit</div>
          <div style="color:#a0a0a0; font-size:13px; margin-top:3px;">Audit agent in Excel &amp; Word</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
